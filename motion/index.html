<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCID LABS LTD - Motion Player</title>
<link rel="icon" href="../brand/logo/png/mark-32-dark.png">
<style>
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
  :root{--bg:#0B0A08;--surface:#12100C;--text:#E8E2D4;--muted:#8A8272;--amber:#FFB000;--border:#2A2620;--green:#3FBF6B;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;}
  .app{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:390px;flex:0 0 390px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:22px 22px 50px;}
  .brandline{font-size:10px;letter-spacing:.18em;color:var(--amber);margin-bottom:6px;}
  .h1{font-size:17px;font-weight:700;margin:0 0 4px;}
  .sub{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
  .panel-heading{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:7px;margin:20px 0 12px;}
  .comp-btn{width:100%;text-align:left;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11.5px;padding:9px 11px;cursor:pointer;border-radius:2px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;}
  .comp-btn small{opacity:.6;font-size:9.5px;white-space:nowrap;}
  .comp-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,.06);}
  .comp-btn:hover{color:var(--text);}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field label{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .field input,.field select{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:8px 9px;border-radius:2px;width:100%;}
  .field input:focus{outline:none;border-color:var(--amber);}
  .row{display:flex;gap:6px;}
  .row>*{flex:1;}
  .btn{width:100%;background:var(--amber);color:#1A1200;border:none;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.08em;padding:12px;cursor:pointer;border-radius:2px;text-transform:uppercase;margin-top:6px;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber);}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;overflow:auto;
    background:repeating-linear-gradient(45deg,#0d0c09 0 14px,#0a0908 14px 28px);}
  .frame{max-width:100%;max-height:72vh;line-height:0;box-shadow:0 30px 90px rgba(0,0,0,.7);border:1px solid var(--border);}
  canvas{max-width:100%;max-height:72vh;display:block;}
  .controls{display:flex;align-items:center;gap:10px;width:min(100%,900px);}
  .controls button{background:transparent;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:11px;padding:8px 14px;cursor:pointer;border-radius:2px;letter-spacing:.06em;}
  .controls button:hover{border-color:var(--amber);color:var(--amber);}
  .controls input[type=range]{flex:1;accent-color:var(--amber);}
  .time{font-size:11px;color:var(--muted);min-width:86px;text-align:right;}
  .meta{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
  .meta b{color:var(--text);font-weight:500;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--amber);color:#1A1200;font-size:12px;font-weight:700;padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;transition:.2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:900px){.app{flex-direction:column;height:auto;}.sidebar{width:100%;flex:none;}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brandline">LUCID LABS LTD</div>
    <div class="h1">Motion Player</div>
    <div class="sub">Live canvas playback. Deterministic — this is the same code the renderer uses.</div>

    <div class="panel-heading">Composition</div>
    <div id="compList"></div>

    <div class="panel-heading">Props</div>
    <div id="props"></div>

    <div class="panel-heading">Format</div>
    <div class="field">
      <label>Size</label>
      <select id="size">
        <option value="1920x1080">1920 × 1080 — 16:9</option>
        <option value="1080x1920">1080 × 1920 — 9:16</option>
        <option value="1080x1080">1080 × 1080 — 1:1</option>
      </select>
    </div>
    <div class="field">
      <label>Theme</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="paper">Paper</option>
      </select>
    </div>

    <button class="btn" id="record">Download MP4</button>
    <button class="btn ghost" id="png">Save current frame (PNG)</button>
    <div class="sub" style="margin-top:14px">H.264 MP4, sized for X — upload it straight from your phone.<br><span id="exportNote"></span></div>
  </aside>

  <main class="stage">
    <div class="frame"><canvas id="stage"></canvas></div>
    <div class="controls">
      <button id="play">Pause</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span class="time" id="time">0.00s</span>
    </div>
    <div class="meta"><b id="compName">—</b> · <span id="dim">1920 × 1080</span> · 30fps</div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="../brand/engine.js"></script>
<script src="comps.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script>
(function(){
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var state = { comp: 'boot-sting', size: '1920x1080', theme: 'dark', playing: true, t: 0, props: {} };
  var last = performance.now();

  var PROPS = {
    'boot-sting': { tagline: "WE DON'T PROPOSE THE FUTURE. WE BUILD IT." },
    'typewriter': { text: "Nigeria's first autonomous delivery fleet is live.", accent: "autonomous", kicker: "LUCID LABS LTD · LAGOS, NG" },
    'stat-counter': { value: 62, suffix: "%", label: "DROP TEST PASS RATE" },
    'section-card': { kicker: "BUILT, NOT PROPOSED", text: "Engineered from zero." },
    'lower-third': { name: "LUCID LABS LTD", role: "WE BUILD THE FUTURE" },
    'built-stamp': { label: "BUILT" },
    'flash-wipe': {},
    'end-card': { text: "lucidlabsltd.com" },
    'scanlines': {},
    'bar-sweep': { value: 100, max: 100 }
  };

  function dims(){
    var p = state.size.split('x');
    return { w: parseInt(p[0],10), h: parseInt(p[1],10) };
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove('show'); }, 1600);
  }

  function buildCompList(){
    var box = document.getElementById('compList');
    box.innerHTML = '';
    LucidMotion.list().forEach(function(c){
      var b = document.createElement('button');
      b.className = 'comp-btn' + (c.id === state.comp ? ' active' : '');
      b.innerHTML = '<span>' + c.label + '</span><small>' + c.duration + 's</small>';
      b.onclick = function(){
        state.comp = c.id;
        state.t = 0;
        state.props = Object.assign({}, PROPS[c.id] || {});
        buildCompList(); buildProps(); resize(); drawFrame();
      };
      box.appendChild(b);
    });
  }

  function buildProps(){
    var box = document.getElementById('props');
    box.innerHTML = '';
    var props = PROPS[state.comp] || {};
    Object.keys(props).forEach(function(key){
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var lab = document.createElement('label');
      lab.textContent = key;
      var inp = document.createElement('input');
      inp.value = state.props[key] != null ? state.props[key] : props[key];
      inp.oninput = function(){ state.props[key] = inp.value; drawFrame(); };
      wrap.appendChild(lab); wrap.appendChild(inp);
      box.appendChild(wrap);
    });
    if (!Object.keys(props).length) {
      box.innerHTML = '<div class="sub">No props — this comp is purely decorative.</div>';
    }
  }

  function resize(){
    var d = dims();
    canvas.width = d.w; canvas.height = d.h;
    document.getElementById('dim').textContent = d.w + ' × ' + d.h;
    var c = LucidMotion.get(state.comp);
    document.getElementById('compName').textContent = c ? c.label : state.comp;
  }

  function renderAt(t){
    var d = dims();
    var comp = LucidMotion.get(state.comp);
    var theme = LucidBrand.THEMES[state.theme];
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,d.w,d.h);
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0,0,d.w,d.h);
    LucidMotion.drawScene(
      { ctx: ctx, w: d.w, h: d.h, theme: theme, themeKey: state.theme },
      { comp: state.comp, in: 0, out: comp ? comp.duration : 3, props: state.props },
      t
    );
  }

  function drawFrame(){
    var comp = LucidMotion.get(state.comp);
    var dur = comp ? comp.duration : 3;
    renderAt(state.t);
    document.getElementById('time').textContent = state.t.toFixed(2) + 's / ' + dur.toFixed(2) + 's';
    document.getElementById('scrub').value = Math.round((state.t / dur) * 1000);
  }

  function loop(now){
    var dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    if (state.playing) {
      var comp = LucidMotion.get(state.comp);
      var dur = comp ? comp.duration : 3;
      state.t += dt;
      if (state.t > dur) state.t = 0;
      drawFrame();
    }
    requestAnimationFrame(loop);
  }

  document.getElementById('play').onclick = function(){
    state.playing = !state.playing;
    this.textContent = state.playing ? 'Pause' : 'Play';
  };
  document.getElementById('scrub').oninput = function(){
    state.playing = false;
    document.getElementById('play').textContent = 'Play';
    var comp = LucidMotion.get(state.comp);
    state.t = (this.value / 1000) * (comp ? comp.duration : 3);
    drawFrame();
  };
  document.getElementById('size').onchange = function(){ state.size = this.value; resize(); drawFrame(); };
  document.getElementById('theme').onchange = function(){ state.theme = this.value; drawFrame(); };

  document.getElementById('png').onclick = function(){
    canvas.toBlob(function(b){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'lucid-' + state.comp + '-frame.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
      toast('Frame saved');
    }, 'image/png');
  };

  // ---- video export -------------------------------------------------------
  // Primary path: WebCodecs H.264 + an MP4 muxer. Frame-exact, faster than
  // realtime, and the file is uploadable to X without a re-encode.
  // Fallback: MediaRecorder (mp4 where the browser supports it, else webm).
  var EXPORT_FPS = 30;
  var H264 = ['avc1.640028','avc1.4d0028','avc1.420028','avc1.64002a','avc1.4d002a','avc1.42002a','avc1.64001f'];
  var exportBtn = document.getElementById('record');
  var busy = false;

  var canMp4 = !!(window.VideoEncoder && window.Mp4Muxer && window.VideoFrame);
  document.getElementById('exportNote').textContent = canMp4
    ? 'Encoding runs in your browser.'
    : 'This browser has no WebCodecs — the export falls back to its recorder.';

  function saveBlob(blob, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
  }

  function setBusy(on, label){
    busy = on;
    exportBtn.disabled = on;
    exportBtn.textContent = label || 'Download MP4';
    exportBtn.style.opacity = on ? '.65' : '1';
    exportBtn.style.cursor = on ? 'progress' : 'pointer';
  }

  function tick(){ return new Promise(function(r){ setTimeout(r, 0); }); }

  async function fontsReady(){
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.all([400,500,700,800].map(function(w){
        return document.fonts.load(w + " 16px 'JetBrains Mono'");
      }));
    } catch (e) {}
  }

  function pausePlayback(){
    var was = state.playing;
    state.playing = false;
    document.getElementById('play').textContent = 'Play';
    return was;
  }

  function resumePlayback(was){
    state.t = 0;
    if (was) { state.playing = true; document.getElementById('play').textContent = 'Pause'; }
    drawFrame();
  }

  async function pickCodec(w, h, bps){
    for (var i = 0; i < H264.length; i++){
      try {
        var s = await VideoEncoder.isConfigSupported({
          codec: H264[i], width: w, height: h, bitrate: bps, framerate: EXPORT_FPS, avc: { format: 'avc' }
        });
        if (s.supported) return H264[i];
      } catch (e) {}
    }
    return null;
  }

  async function exportMp4(){
    var d = dims();
    var comp = LucidMotion.get(state.comp);
    var dur = comp ? comp.duration : 3;
    var total = Math.max(1, Math.round(dur * EXPORT_FPS));
    var bps = Math.min(14000000, Math.max(3000000, Math.round(d.w * d.h * EXPORT_FPS * 0.12)));
    var was = pausePlayback();

    await fontsReady();
    var codec = await pickCodec(d.w, d.h, bps);
    if (!codec) throw new Error('No H.264 encoder for ' + d.w + 'x' + d.h);

    var muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width: d.w, height: d.h, frameRate: EXPORT_FPS },
      fastStart: 'in-memory'
    });

    var encodeError = null;
    var encoder = new VideoEncoder({
      output: function(chunk, meta){ muxer.addVideoChunk(chunk, meta); },
      error: function(e){ encodeError = e; }
    });
    encoder.configure({
      codec: codec, width: d.w, height: d.h, bitrate: bps, framerate: EXPORT_FPS,
      latencyMode: 'quality', avc: { format: 'avc' }
    });

    for (var f = 0; f < total; f++){
      if (encodeError) { try { encoder.close(); } catch (e) {} throw encodeError; }
      renderAt(f / EXPORT_FPS);
      var vf = new VideoFrame(canvas, {
        timestamp: Math.round(f * 1000000 / EXPORT_FPS),
        duration: Math.round(1000000 / EXPORT_FPS)
      });
      encoder.encode(vf, { keyFrame: f % EXPORT_FPS === 0 });
      vf.close();
      if (encoder.encodeQueueSize > 8) await new Promise(function(r){ setTimeout(r, 4); });
      if (f % 5 === 0){
        setBusy(true, 'Encoding ' + Math.round((f / total) * 100) + '%');
        await tick();
      }
    }

    setBusy(true, 'Finishing…');
    await encoder.flush();
    encoder.close();
    muxer.finalize();

    var blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    saveBlob(blob, 'lucid-' + state.comp + '-' + d.w + 'x' + d.h + '.mp4');
    resumePlayback(was);
    toast('MP4 saved · ' + d.w + '×' + d.h + ' · ' + dur.toFixed(1) + 's');
  }

  function recordFallback(){
    if (!window.MediaRecorder){ toast('This browser cannot export video'); return; }
    var types = ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4',
                 'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    var mime = null;
    for (var i = 0; i < types.length; i++){
      if (MediaRecorder.isTypeSupported(types[i])) { mime = types[i]; break; }
    }
    if (!mime){ toast('This browser cannot export video'); return; }

    var isMp4 = mime.indexOf('mp4') >= 0;
    var ext = isMp4 ? 'mp4' : 'webm';
    var d = dims();
    var comp = LucidMotion.get(state.comp);
    var dur = comp ? comp.duration : 3;
    var was = pausePlayback();
    var stream = canvas.captureStream(EXPORT_FPS);
    var rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
    var chunks = [];
    setBusy(true, 'Recording 0%');
    rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      var blob = new Blob(chunks, { type: isMp4 ? 'video/mp4' : 'video/webm' });
      saveBlob(blob, 'lucid-' + state.comp + '-' + d.w + 'x' + d.h + '.' + ext);
      resumePlayback(was);
      setBusy(false);
      toast(isMp4 ? 'MP4 saved · ' + d.w + '×' + d.h : 'Saved as WebM — this browser cannot encode MP4');
    };
    state.t = 0;
    renderAt(0);
    rec.start();
    var started = performance.now();
    (function step(){
      var t = (performance.now() - started) / 1000;
      state.t = Math.min(t, dur);
      renderAt(state.t);
      setBusy(true, 'Recording ' + Math.min(100, Math.round((state.t / dur) * 100)) + '%');
      if (t < dur) requestAnimationFrame(step);
      else rec.stop();
    })();
  }

  exportBtn.onclick = async function(){
    if (busy) return;
    if (!canMp4){ recordFallback(); return; }
    setBusy(true, 'Preparing…');
    try {
      await exportMp4();
      setBusy(false);
    } catch (e){
      console.warn('MP4 export failed, using MediaRecorder instead', e);
      setBusy(false);
      recordFallback();
    }
  };

  document.getElementById('size').value = state.size;
  state.props = Object.assign({}, PROPS[state.comp]);
  buildCompList(); buildProps(); resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
