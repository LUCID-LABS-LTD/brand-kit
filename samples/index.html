<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCID LABS LTD — Card samples</title>
<link rel="icon" href="../brand/logo/png/mark-32-dark.png">
<link rel="stylesheet" href="../brand/brand.css">
<style>
  body{background:var(--ll-bg);color:var(--ll-text);font-family:var(--ll-font);margin:0;padding:40px 28px 80px;}
  header{max-width:1320px;margin:0 auto 34px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
  .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--ll-accent);margin-bottom:8px;}
  h1{font-size:24px;margin:0;letter-spacing:.02em;}
  header p{margin:8px 0 0;font-size:12px;color:var(--ll-muted);max-width:52ch;line-height:1.6;}
  header nav a{font-size:10px;letter-spacing:.14em;color:var(--ll-muted);text-decoration:none;border-bottom:1px solid var(--ll-border);padding-bottom:3px;margin-left:16px;}
  header nav a:hover{color:var(--ll-accent);border-color:var(--ll-accent);}
  main{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;}
  .card{margin:0;border:1px solid var(--ll-border);background:var(--ll-surface);}
  .card img{width:100%;display:block;}
  figcaption{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;font-size:10px;letter-spacing:.08em;border-top:1px solid var(--ll-border);}
  figcaption b{color:var(--ll-text);font-weight:500;text-transform:uppercase;}
  figcaption span{color:var(--ll-muted);}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">LUCID LABS LTD</div>
    <h1>Card samples</h1>
    <p>Generated by <code>tools/make-samples.cjs</code>. Every card passed the amber-budget check at build time.</p>
  </div>
  <nav><a href="../cards/index.html">Card Studio</a><a href="../motion/index.html">Motion Player</a></nav>
</header>
<main>
      <figure class="card">
        <a href="fleet-live.png" target="_blank" rel="noopener"><img src="fleet-live.png" alt="fleet-live" loading="lazy"></a>
        <figcaption>
          <b>announcement</b>
          <span>dark · 1600x900 · 2.01% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="thread-opener.png" target="_blank" rel="noopener"><img src="thread-opener.png" alt="thread-opener" loading="lazy"></a>
        <figcaption>
          <b>hook</b>
          <span>dark · 1080x1350 · 0.77% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="drop-test.png" target="_blank" rel="noopener"><img src="drop-test.png" alt="drop-test" loading="lazy"></a>
        <figcaption>
          <b>stat</b>
          <span>dark · 1600x900 · 2.16% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="build-status.png" target="_blank" rel="noopener"><img src="build-status.png" alt="build-status" loading="lazy"></a>
        <figcaption>
          <b>buildlog</b>
          <span>dark · 1600x900 · 0.81% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="build-window.png" target="_blank" rel="noopener"><img src="build-window.png" alt="build-window" loading="lazy"></a>
        <figcaption>
          <b>terminal</b>
          <span>dark · 1600x900 · 0.45% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="field-note.png" target="_blank" rel="noopener"><img src="field-note.png" alt="field-note" loading="lazy"></a>
        <figcaption>
          <b>quote</b>
          <span>paper · 1080x1080 · 0.33% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="quiet-mark.png" target="_blank" rel="noopener"><img src="quiet-mark.png" alt="quiet-mark" loading="lazy"></a>
        <figcaption>
          <b>minimal</b>
          <span>dark · 1080x1080 · 0.03% amber</span>
        </figcaption>
      </figure>
      <figure class="card">
        <a href="paper-announce.png" target="_blank" rel="noopener"><img src="paper-announce.png" alt="paper-announce" loading="lazy"></a>
        <figcaption>
          <b>announcement</b>
          <span>paper · 1080x1350 · 0.53% amber</span>
        </figcaption>
      </figure>
</main>
</body>
</html>
