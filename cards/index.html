<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCID LABS LTD - Card Studio</title>
<link rel="icon" href="../brand/logo/png/mark-32-dark.png">
<style>
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'JetBrains Mono';src:url('../brand/fonts/JetBrainsMono-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}

  :root{
    --bg:#0B0A08; --surface:#12100C; --text:#E8E2D4; --muted:#8A8272;
    --amber:#FFB000; --border:#2A2620; --green:#3FBF6B;
    --p-bg:#F0EBDD; --p-surface:#E9E3D2; --p-text:#26221A; --p-muted:#6E675A; --p-amber:#9A5B00; --p-border:#D5CDB8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;}
  .app{display:flex;height:100vh;overflow:hidden;}

  .sidebar{width:400px;flex:0 0 400px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:22px 22px 60px;}
  .brandline{font-size:10px;letter-spacing:.18em;color:var(--amber);margin-bottom:6px;}
  .h1{font-size:17px;font-weight:700;letter-spacing:.03em;margin:0 0 4px;}
  .sub{font-size:11px;color:var(--muted);margin-bottom:22px;line-height:1.6;}
  .panel-heading{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:7px;margin:22px 0 12px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .tab-btn{text-align:left;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:.04em;padding:9px 10px;cursor:pointer;border-radius:2px;line-height:1.35;}
  .tab-btn small{display:block;font-size:9px;opacity:.65;margin-top:3px;letter-spacing:0;}
  .tab-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,.06);}
  .tab-btn:hover{color:var(--text);}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .field input,.field textarea,.field select{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:2px;resize:vertical;width:100%;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--amber);}
  .field textarea{min-height:92px;line-height:1.55;}
  .row{display:flex;gap:6px;}
  .row>*{flex:1;}

  .seg{display:flex;gap:4px;}
  .seg button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px;padding:8px 4px;cursor:pointer;border-radius:2px;}
  .seg button.active{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,.06);}

  .btn{width:100%;margin-top:8px;background:var(--amber);color:#1A1200;border:none;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.08em;padding:13px;cursor:pointer;border-radius:2px;text-transform:uppercase;}
  .btn:hover{background:#FFC23D;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber);}

  .meter{margin-top:14px;}
  .meter-top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
  .meter-bar{height:6px;background:var(--border);position:relative;border-radius:1px;overflow:hidden;}
  .meter-fill{height:100%;background:var(--green);width:0%;transition:width .2s,background .2s;}
  .meter-limit{position:absolute;left:10%;top:0;bottom:0;width:1px;background:var(--text);opacity:.5;}
  .note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
  .warn{color:var(--amber);}

  .stage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;gap:14px;
    background:repeating-linear-gradient(45deg,#0d0c09 0 14px,#0a0908 14px 28px);}
  .frame{width:min(100%,980px);box-shadow:0 30px 90px rgba(0,0,0,.65);border:1px solid var(--border);line-height:0;}
  .frame canvas{width:100%;height:auto;display:block;}
  .stage-meta{display:flex;gap:14px;font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
  .stage-meta b{color:var(--text);font-weight:500;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--amber);color:#1A1200;font-size:12px;font-weight:700;letter-spacing:.06em;padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;transition:all .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:900px){.app{flex-direction:column;height:auto;}.sidebar{width:100%;flex:none;border-right:none;border-bottom:1px solid var(--border);}.stage{min-height:60vh;}}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brandline">LUCID LABS LTD</div>
    <div class="h1">Card Studio</div>
    <div class="sub">One graphic for every post. Type the post, pick a layout, export.</div>

    <div class="panel-heading">Post text</div>
    <div class="field">
      <textarea id="postText" placeholder="Paste the post you're about to publish…"></textarea>
    </div>
    <div class="field">
      <label>Amber emphasis <span style="opacity:.6">(one word or phrase)</span></label>
      <input id="accent" placeholder="auto">
    </div>
    <div class="field">
      <label>Kicker</label>
      <input id="kicker" placeholder="auto per layout">
    </div>
    <div class="field">
      <label>Sub-copy <span style="opacity:.6">(optional, overriding)</span></label>
      <textarea id="body" style="min-height:52px" placeholder="pulled from the post"></textarea>
    </div>

    <div class="panel-heading">Layout</div>
    <div class="grid" id="layoutGrid"></div>

    <div class="panel-heading">Format</div>
    <div class="field">
      <label>Size</label>
      <div class="seg" id="sizeSeg">
        <button data-size="16x9" class="active">16:9</button>
        <button data-size="4x5">4:5</button>
        <button data-size="1x1">1:1</button>
      </div>
    </div>
    <div class="field">
      <label>Theme</label>
      <div class="seg" id="themeSeg">
        <button data-theme="dark" class="active">Dark</button>
        <button data-theme="paper">Paper</button>
      </div>
    </div>

    <div class="panel-heading">Export</div>
    <button class="btn" id="downloadBtn">Download PNG</button>
    <button class="btn ghost" id="copyBtn">Copy image</button>

    <div class="meter">
      <div class="meter-top"><span>Amber budget</span><span id="amberLabel">—</span></div>
      <div class="meter-bar"><div class="meter-fill" id="amberFill"></div><div class="meter-limit"></div></div>
    </div>
    <div class="note" id="brandNote">Amber is emphasis-only, 10% max. Green appears only on a BUILT chip.</div>
  </aside>

  <main class="stage">
    <div class="frame"><canvas id="card"></canvas></div>
    <div class="stage-meta">
      <span><b id="metaSize">1600 × 900</b></span>
      <span><b id="metaLayout">announcement</b></span>
      <span>2× export</span>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="../brand/engine.js"></script>
<script src="layouts.js"></script>
<script src="card.js"></script>
<script>
(function(){
  var canvas = document.getElementById('card');
  var ctx = canvas.getContext('2d');
  var state = { layout:'announcement', size:'16x9', theme:'dark', scale:2 };
  var renderTimer = null;

  var els = {
    text: document.getElementById('postText'),
    accent: document.getElementById('accent'),
    kicker: document.getElementById('kicker'),
    body: document.getElementById('body'),
    grid: document.getElementById('layoutGrid'),
    amberFill: document.getElementById('amberFill'),
    amberLabel: document.getElementById('amberLabel'),
    note: document.getElementById('brandNote'),
    metaSize: document.getElementById('metaSize'),
    metaLayout: document.getElementById('metaLayout'),
    toast: document.getElementById('toast')
  };

  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ els.toast.classList.remove('show'); }, 1800);
  }

  LucidCard.list().forEach(function(l){
    var b = document.createElement('button');
    b.className = 'tab-btn' + (l.id === state.layout ? ' active' : '');
    b.dataset.layout = l.id;
    b.innerHTML = l.label + '<small>' + l.hint + '</small>';
    b.onclick = function(){
      state.layout = l.id;
      document.querySelectorAll('#layoutGrid .tab-btn').forEach(function(x){ x.classList.toggle('active', x.dataset.layout === l.id); });
      render();
    };
    els.grid.appendChild(b);
  });

  document.querySelectorAll('#sizeSeg button').forEach(function(b){
    b.onclick = function(){
      state.size = b.dataset.size;
      document.querySelectorAll('#sizeSeg button').forEach(function(x){ x.classList.toggle('active', x === b); });
      render();
    };
  });
  document.querySelectorAll('#themeSeg button').forEach(function(b){
    b.onclick = function(){
      state.theme = b.dataset.theme;
      document.querySelectorAll('#themeSeg button').forEach(function(x){ x.classList.toggle('active', x === b); });
      render();
    };
  });

  ['input','change'].forEach(function(ev){
    [els.text, els.accent, els.kicker, els.body].forEach(function(el){
      el.addEventListener(ev, function(){ schedule(); });
    });
  });

  function schedule(){
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 140);
  }

  function currentSpec(){
    var size = LucidCard.SIZES[state.size];
    return LucidCard.normalize(els.text.value || '', {
      layout: state.layout,
      size: state.size,
      theme: state.theme,
      accent: els.accent.value.trim() || null,
      kicker: els.kicker.value.trim() || null,
      body: els.body.value.trim() ? els.body.value : undefined
    });
  }

  function checkBrand(){
    var small = document.createElement('canvas');
    var w = 480, h = Math.round(w * (canvas.height / canvas.width));
    small.width = w; small.height = h;
    small.getContext('2d').drawImage(canvas, 0, 0, w, h);
    var spec = currentSpec();
    return LucidBrand.checkBrand(small, {
      theme: spec.themeKey,
      allowGreen: spec.layout === 'buildlog'
    });
  }

  function render(){
    var spec = currentSpec();
    canvas.width = spec.width * state.scale;
    canvas.height = spec.height * state.scale;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.scale(state.scale, state.scale);
    LucidCards.draw(ctx, spec.width, spec.height, spec);
    canvas.__spec = spec;

    els.metaSize.textContent = spec.width + ' × ' + spec.height;
    els.metaLayout.textContent = spec.layout;

    var check = checkBrand();
    if (check.amberPct == null) {
      els.amberLabel.textContent = 'n/a';
    } else {
      els.amberLabel.textContent = check.amberPct.toFixed(1) + '% / 10%';
      els.amberFill.style.width = Math.min(100, (check.amberPct / 10) * 100) + '%';
      els.amberFill.style.background = check.amberPct > 10 ? 'var(--amber)' : 'var(--green)';
    }
    els.note.className = 'note' + (check.ok ? '' : ' warn');
    els.note.textContent = check.ok
      ? 'Brand check passed. Amber is emphasis-only, 10% max.'
      : 'Fix: ' + check.violations.join(' · ');
  }

  document.getElementById('downloadBtn').onclick = function(){
    var spec = canvas.__spec || currentSpec();
    LucidCard.download(canvas, 'lucid-' + spec.layout + '-' + LucidCard.slugify(spec.headline) + '.png');
    toast('PNG exported');
  };

  document.getElementById('copyBtn').onclick = function(){
    LucidCard.copy(canvas).then(function(){ toast('Copied to clipboard'); }, function(e){ toast('Copy failed'); console.warn(e); });
  };

  // deep link: ?text=...&layout=...
  var q = new URLSearchParams(location.search);
  if (q.get('text')) els.text.value = q.get('text');
  if (q.get('layout') && LucidCard.layouts[q.get('layout')]) {
    state.layout = q.get('layout');
    document.querySelectorAll('#layoutGrid .tab-btn').forEach(function(x){ x.classList.toggle('active', x.dataset.layout === state.layout); });
  }
  if (q.get('size') && LucidCard.SIZES[q.get('size')]) state.size = q.get('size');
  if (q.get('theme')) state.theme = q.get('theme');

  if (!els.text.value) {
    els.text.value = "Nigeria's first autonomous delivery fleet is live. Built end-to-end in Lagos — navigation, power, and fleet control, engineered from zero.";
  }
  // Re-render once the TTFs are in memory: a cold load would otherwise draw
  // the first card in the fallback monospace.
  var fontsReady = (document.fonts && document.fonts.load)
    ? Promise.all([400, 500, 700, 800].map(function (w) {
        return document.fonts.load(w + " 16px 'JetBrains Mono'").catch(function () {});
      }))
    : Promise.resolve();
  fontsReady.then(render);
})();
</script>
</body>
</html>
